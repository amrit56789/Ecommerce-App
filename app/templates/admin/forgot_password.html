{% extends "base.html" %}

{% block content %}
  <div class="forgot-container">
    <div class="forgot-box">
      <h1 class="title">Forgot Password</h1>
      <p class="subtitle">Enter your email to reset your password.</p>
      <div id="message" class="message hidden"></div>
      <div id="error-message" class="error-message hidden"></div>

      <form id="forgot-form">
        <div class="input-group">
          <label for="email" class="input-label">Email</label>
          <input type="email" id="email" placeholder="Enter your email" class="input-field" required>
        </div>

        <button type="submit" class="submit-btn">Send Reset Link</button>
      </form>
    </div>
  </div>
{% endblock %}

{% block js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const forgotForm = document.getElementById('forgot-form');
    const message = document.getElementById('message');
    const errorMessage = document.getElementById('error-message');

    forgotForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();

      // Clear previous messages
      message.textContent = '';
      errorMessage.textContent = '';
      message.classList.add('hidden');
      errorMessage.classList.add('hidden');

      try {
        const response = await fetch('/auth/send-email-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.message) {
            message.textContent = data.message;
            message.classList.remove('hidden');
          } else {
            message.textContent = 'Check your email for the reset link.';
            message.classList.remove('hidden');
          }
        } else {
          if (data.message) {
            errorMessage.textContent = data.message;
          } else {
            errorMessage.textContent = 'Failed to send reset link.';
          }
          errorMessage.classList.remove('hidden');
        }
      } catch (err) {
        errorMessage.textContent = err;
        errorMessage.classList.remove('hidden');
      }
    });
  });
</script>

{% endblock %}
