<!-- templates/admin/login.html -->
{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-3xl font-semibold text-center text-blue-600 mb-6">Admin Login</h1>

    <div id="error-message" class="text-red-600 mb-4 hidden"></div>

    <form id="login-form">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" required class="mt-1 p-3 w-full border border-gray-300 rounded-md">
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" required class="mt-1 p-3 w-full border border-gray-300 rounded-md">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 transition">Login</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const response = await fetch('/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });

      const result = await response.json();

      if (!response.ok) {
        document.getElementById('error-message').textContent = result.message;
        document.getElementById('error-message').classList.remove('hidden');
      } else {
        localStorage.setItem('access_token', result.access_token);
        window.location.href = '/admin/dashboard';
      }
    } catch (err) {
      console.error(err);
      document.getElementById('error-message').textContent = 'Something went wrong.';
      document.getElementById('error-message').classList.remove('hidden');
    }
  });
</script>
{% endblock %}
