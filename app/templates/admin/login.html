{% extends "base.html" %}

{% block content %}
<div class="login-container">
  <div class="login-box">
    <h1 class="title">Sign in to your account</h1>

    <div id="error-message" class="error-message hidden"></div>

    <form id="login-form">
      <div class="input-group">
        <label for="email" class="input-label">Email</label>
        <input type="email" id="email" placeholder="Enter your email" class="input-field">
      </div>

      <div class="input-group password-group">
        <label for="password" class="input-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" class="input-field">
          <span class="toggle-password" onclick="togglePassword('password', this)">
            <i class="bi bi-eye"></i>
          </span>
        </div>
      </div>

      <div class="forgot-password">
        <a href="{{ url_for('admin_ui.forgot_password') }}" class="forgot-password-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <div class="signup-link">
      <p>Don't have an account?<a href="{{ url_for('admin_ui.signup_page') }}" class="signup-link-text"> Create an
          account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      errorMessage.textContent = '';
      errorMessage.classList.add('hidden');

      if (!email || !password) {
        errorMessage.textContent = 'Please fill in both email and password.';
        errorMessage.classList.remove('hidden');
        return;
      }

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          loginForm.reset();
          window.location.href = '/admin/dashboard';
        } else {
          errorMessage.textContent = data.message || 'An error occurred, please try again.';
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        errorMessage.textContent = 'An error occurred, please try again.';
        errorMessage.classList.remove('hidden');
      }
    });

  });

  function togglePassword(fieldId, toggleElement) {
    const input = document.getElementById(fieldId);
    const icon = toggleElement.querySelector('i');

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("bi-eye");
      icon.classList.add("bi-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("bi-eye-slash");
      icon.classList.add("bi-eye");
    }
  }
</script>
{% endblock %}
