{% extends "base.html" %}

{% block title %}Add Seller{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-lg shadow p-6 max-w-3xl mx-auto mt-8">
  <h1 class="text-2xl font-bold mb-6 text-gray-800">Add Seller</h1>
  <form method="POST" action="#" enctype="multipart/form-data" class="space-y-5">
   

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" name="name" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Phone</label>
        <input type="tel" name="phone" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Store Name</label>
        <input type="text" name="store_name" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Store Logo</label>
        <input type="file" name="store_logo" accept="image/*" class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Business Address</label>
        <input type="text" name="address" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">City</label>
        <input type="text" name="city" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">State</label>
        <input type="text" name="state" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Country</label>
        <input type="text" name="country" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Pincode</label>
        <input type="text" name="pincode" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">GST Number</label>
        <input type="text" name="gst_number" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">IFSC Code</label>
        <input type="text" name="ifsc_code" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" name="password" required class="form-input">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" name="confirm_password" required class="form-input">
      </div>
    </div>

    <div class="pt-6">
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md shadow">
        Register Seller
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block js %}
<script>
</script>
{% endblock %}
